<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }
    .login-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.15);
        width: 300px;
    }
    h1 { text-align: center; font-size: 22px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="text"], input[type="password"] {
        width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;
    }
    button {
        margin-top: 20px; width: 100%; padding: 10px;
        background-color: #333; color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #555; }
    .extra { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<div class="login-box">
    <h1>Login</h1>
    <form action="#" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>
    <p class="extra">Forgot password? &nbsp;|&nbsp; New user? Register</p>
</div>

</body>
</html>
