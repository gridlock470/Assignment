<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { max-width: 400px; margin: 0 auto; border: 1px solid #ccc; padding: 25px; border-radius: 8px; }
    h1 { text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="password"], select {
        width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;
    }
    .radio-group label, .checkbox-group label { display: inline-block; font-weight: normal; margin-right: 15px; }
    button { margin-top: 20px; width: 100%; padding: 10px; background-color: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #555; }
</style>
</head>
<body>

<h1>Registration Form</h1>

<form action="#" method="post">

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter a password" required>

    <label>Gender</label>
    <div class="radio-group">
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
    </div>

    <label>Interests</label>
    <div class="checkbox-group">
        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>
    </div>

    <label for="country">Country</label>
    <select id="country" name="country">
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="other">Other</option>
    </select>

    <button type="submit">Register</button>

</form>

</body>
</html>
