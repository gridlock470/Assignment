<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
</head>
<body>
  <h2>Signup Form</h2>
  <form onsubmit="return validate()">
    Name: <input type="text" id="name"><br><br>
    Email: <input type="email" id="email"><br><br>
    Password: <input type="password" id="pass"><br><br>
    <button type="submit">Signup</button>
  </form>
  <p id="msg"></p>

  <script>
    function validate() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let pass = document.getElementById("pass").value;
      if (name === "" || email === "" || pass === "") {
        document.getElementById("msg").innerHTML = "All fields required!";
        return false;
      }
      if (pass.length < 6) {
        document.getElementById("msg").innerHTML = "Password must be at least 6 characters!";
        return false;
      }
      document.getElementById("msg").innerHTML = "Signup successful!";
      return false; // prevent actual submit for demo
    }
  </script>
</body>
</html>
